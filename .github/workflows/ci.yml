name: CI

on:
  push:
    branches:
      - main
      - master
      - prod
      - develop
  pull_request:
    branches:
      - main
      - master
      - prod
      - develop

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify
